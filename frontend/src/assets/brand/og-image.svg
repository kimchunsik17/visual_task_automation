<!-- OG 카드 소스 (1200x630). Documents/icon-generation-prompts.md §4-2 프롬프트를 벡터로 구현.
     playwright 로 public/og-image-1200x630.png 로 래스터화한다.
     텍스트 요소 없음 — 좌 2/3 노드 그래프, 우 1/3 로고 마크. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="og-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>

    <filter id="og-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="og-logo-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="og-logo-grad" gradientUnits="userSpaceOnUse"
                    x1="2" y1="30" x2="30" y2="2">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- 노드 카드 1개 = 라운드 사각 + 상태 점 + 추상 콘텐츠 바 2줄 (문자 없음) -->
    <g id="og-node">
      <rect width="150" height="80" rx="18" fill="currentColor" fill-opacity="0.14"/>
      <rect width="150" height="80" rx="18" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="28" cy="40" r="7" fill="currentColor"/>
      <rect x="48" y="28" width="72" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.55"/>
      <rect x="48" y="45" width="46" height="7" rx="3.5" fill="#e2e8f0" fill-opacity="0.28"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="#0f172a"/>
  <rect width="1200" height="630" fill="url(#og-dots)"/>

  <!-- 커넥터 (좌 2/3) -->
  <g fill="none" stroke-width="2" stroke-linecap="round" filter="url(#og-glow)">
    <path d="M230 315 C 250 315, 250 155, 270 155" stroke="#3b82f6" stroke-opacity="0.85"/>
    <path d="M230 315 C 250 315, 250 470, 270 470" stroke="#8b5cf6" stroke-opacity="0.85"/>
    <path d="M420 155 C 440 155, 440 315, 460 315" stroke="#3b82f6" stroke-opacity="0.85"/>
    <path d="M420 470 C 440 470, 440 315, 460 315" stroke="#3b82f6" stroke-opacity="0.85"/>
    <path d="M610 315 C 630 315, 630 185, 650 185" stroke="#10b981" stroke-opacity="0.85"/>
  </g>

  <!-- 노드 5개 -->
  <g filter="url(#og-glow)">
    <g transform="translate(80 275)"  color="#10b981"><use href="#og-node"/></g>
    <g transform="translate(270 115)" color="#3b82f6"><use href="#og-node"/></g>
    <g transform="translate(270 430)" color="#8b5cf6"><use href="#og-node"/></g>
    <g transform="translate(460 275)" color="#3b82f6"><use href="#og-node"/></g>
    <g transform="translate(650 145)" color="#10b981"><use href="#og-node"/></g>
  </g>

  <!-- 우 1/3: 로고 마크 (220px, 중심 x=1000 y=308) -->
  <g transform="translate(888.3 205) scale(6.875)" filter="url(#og-logo-glow)"
     fill="none" stroke="url(#og-logo-grad)" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13.5 L9.5 25.5 L16 10.5 L22.5 25.5 L28 6.5"/>
    <path d="M12 19.5 H20"/>
    <circle cx="4" cy="13.5" r="3" fill="url(#og-logo-grad)" stroke="none"/>
    <circle cx="28" cy="6.5" r="3.5" fill="url(#og-logo-grad)" stroke="none"/>
  </g>
</svg>
