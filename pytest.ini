[pytest]
# 루트에서 `pytest` 를 그냥 돌렸을 때 backend/ 밖을 수집하지 않게 한다.
# 저장소 루트에는 과거에 스크래치 스크립트(test_models.py 등)가 놓인 적이 있고, 그것들이
# 수집되면 실제 OpenAI 호출이 나간다(.gitignore 가 이름으로 막고 있지만 추적 대상이
# 아닐 뿐 파일 자체는 로컬에 있을 수 있다).
testpaths = backend

# 수집 대상에서 뺄 디렉터리. venv 안의 site-packages 를 훑으면 수집만 수 분 걸리고,
# 남의 패키지 테스트가 우리 결과에 섞인다.
norecursedirs =
    .git
    backend/venv
    backend/chroma_db
    backend/uploads
    backend/migrations
    frontend
    mock_server
    node_modules
    *.egg-info

# 등록되지 않은 마커를 오타로 보고 즉시 실패시킨다. 현재 쓰는 마커는 parametrize(내장),
# asyncio(pytest-asyncio), slow_render 셋뿐이라 이 옵션을 켜도 걸리는 것이 없다.
addopts = --strict-markers

markers =
    slow_render: Chromium 렌더가 필요한 느린 테스트 (포맷 스튜디오 pdf/png)

# pytest-asyncio 8 에서 기본값이 바뀔 예정이라 미리 못 박는다(경고 제거).
asyncio_default_fixture_loop_scope = function
